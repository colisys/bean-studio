name: Resolve app version
description: Build a semantic version with the short git commit hash and a CI build number.
runs:
  using: composite
  steps:
    - name: Resolve version
      shell: bash
      run: |
        set -euo pipefail

        if [[ -z "${GITHUB_SHA:-}" ]]; then
          echo "GITHUB_SHA is not set" >&2
          exit 1
        fi
        SHORT_SHA="${GITHUB_SHA:0:7}"
        BASE_VERSION="$(awk -F': ' '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)"
        if [[ -z "$BASE_VERSION" ]]; then
          echo "Could not read version from pubspec.yaml" >&2
          exit 1
        fi
        # A release tag is authoritative for the base version, e.g. v1.2.3.
        if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
          BASE_VERSION="${BASH_REMATCH[1]}"
        fi

        APP_VERSION="${BASE_VERSION}+g${SHORT_SHA}"
        BUILD_NUMBER="${GITHUB_RUN_NUMBER:?GITHUB_RUN_NUMBER is not set}"

        {
          echo "SHORT_SHA=$SHORT_SHA"
          echo "BASE_VERSION=$BASE_VERSION"
          echo "APP_VERSION=$APP_VERSION"
          echo "BUILD_NUMBER=$BUILD_NUMBER"
        } >> "$GITHUB_ENV"

        echo "Version: $APP_VERSION (build $BUILD_NUMBER, commit $GITHUB_SHA)"
