# SPDX-License-Identifier: GPL-3.0-or-later
name: Build Apps

# Artifacts are kept for 90 days; release.yml reuses them when a tag is added later.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read


jobs:
  linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - uses: ./.github/actions/resolve-version

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev

      - name: Build Linux release
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release \
            --dart-define=APP_VERSION="$APP_VERSION" \
            --dart-define=GIT_COMMIT="$SHORT_SHA"

      - name: Fetch appimagetool
        run: |
          mkdir -p tools
          curl -fsSL -o tools/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x tools/appimagetool

      - name: Package AppImage
        env:
          APPIMAGETOOL: ${{ github.workspace }}/tools/appimagetool
        run: |
          mkdir -p dist
          ./packaging/linux/build_appimage.sh \
            "dist/BeadStudio-${APP_VERSION}-linux-x86_64.AppImage"

      - name: Verify AppImage payload
        run: |
          APPIMAGE="$(find dist -maxdepth 1 -name '*.AppImage' -print -quit)"
          "$APPIMAGE" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/lib/bead_studio/bead_studio
          rm -rf squashfs-root

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 90

  macos-dmg:
    name: macOS DMG
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - uses: ./.github/actions/resolve-version

      - name: Build macOS release
        run: |
          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --release \
            --build-name "$BASE_VERSION" \
            --build-number "$BUILD_NUMBER" \
            --dart-define=APP_VERSION="$APP_VERSION" \
            --dart-define=GIT_COMMIT="$SHORT_SHA"

      - name: Package DMG
        run: |
          APP_PATH="$(ls -d build/macos/Build/Products/Release/*.app | grep -v Tests | head -n 1)"
          test -d "$APP_PATH"
          mkdir -p dist/dmg
          cp -R "$APP_PATH" "dist/dmg/Bead Studio.app"
          ln -s /Applications "dist/dmg/Applications"
          ARCH="$(uname -m)"
          DMG="dist/BeadStudio-${APP_VERSION}-macos-${ARCH}.dmg"
          hdiutil create \
            -volname "Bead Studio ${APP_VERSION}" \
            -srcfolder dist/dmg \
            -ov -format UDZO "$DMG"
          hdiutil verify "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 90

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - uses: ./.github/actions/resolve-version

      - name: Configure Android release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Android signing secrets are not configured; using the debug keystore."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          EOF

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release \
            --build-name "$APP_VERSION" \
            --build-number "$BUILD_NUMBER" \
            --dart-define=APP_VERSION="$APP_VERSION" \
            --dart-define=GIT_COMMIT="$SHORT_SHA"

      - name: Collect APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/BeadStudio-${APP_VERSION}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

  ios-ipa:
    name: iOS unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - uses: ./.github/actions/resolve-version

      - name: Build unsigned iOS app
        run: |
          flutter pub get
          flutter build ios --release --no-codesign \
            --build-name "$BASE_VERSION" \
            --build-number "$BUILD_NUMBER" \
            --dart-define=APP_VERSION="$APP_VERSION" \
            --dart-define=GIT_COMMIT="$SHORT_SHA"

      - name: Package unsigned IPA
        run: |
          test -d build/ios/iphoneos/Runner.app
          rm -rf Payload
          mkdir -p Payload dist
          cp -R build/ios/iphoneos/Runner.app Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload \
            "dist/BeadStudio-${APP_VERSION}-ios-unsigned.ipa"
          unzip -t "dist/BeadStudio-${APP_VERSION}-ios-unsigned.ipa" >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 90
