name: bead_studio
description: "拼豆工坊 — 拼豆图案编辑器 / Perler bead pattern studio"
homepage: https://bean.dawncall.work
repository: https://github.com/colisys/bean-studio
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # New Flutter Material/Cupertino split packages (Flutter 3.47+).
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6

  # Camera color picker.
  camera: ^0.12.2
  image_picker: ^1.2.4

  # Files, sharing and storage.
  file_selector: ^1.1.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  web: ^1.1.2

  # Image decoding and palette conversion.
  image: ^4.12.0
  http: ^1.6.0
  open_filex: ^5.0.0
  url_launcher: ^6.3.3
  pub_semver: ^2.2.1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FBF7EF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#FBF7EF"
    theme_color: "#E85D75"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
